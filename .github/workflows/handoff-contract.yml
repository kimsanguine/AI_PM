name: handoff-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/handoff-contract.yml"
      - "contracts/ai-pm-handoff-profile-v0.schema.json"
      - "contracts/fixtures/**"
      - "requirements-dev.txt"
      - "scripts/validate_handoff_profile.py"
      - "tests/test_handoff_profile.py"
  pull_request:
    paths:
      - ".github/workflows/handoff-contract.yml"
      - "contracts/ai-pm-handoff-profile-v0.schema.json"
      - "contracts/fixtures/**"
      - "requirements-dev.txt"
      - "scripts/validate_handoff_profile.py"
      - "tests/test_handoff_profile.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate handoff schema and CLI parity
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests/test_handoff_profile.py -v
